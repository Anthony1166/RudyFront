<!-- La sección solo se muestra si está cargando o si hay procesos.
     Si el proyecto no tiene procesos, no se renderiza nada. -->
<section class="procesos-section" *ngIf="isLoading || procesos.length > 0">
  <div class="procesos-header">
    <h2 class="section-title">PROCESO DE DISEÑO</h2>
  </div>

  <!-- Cargando -->
  <div class="state-box" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>

  <!-- Carrusel -->
  <div class="procesos-carousel"
       *ngIf="!isLoading && procesos.length > 0"
       #carousel
       (mousedown)="onMouseDown($event)"
       (mouseleave)="onMouseLeave()"
       (mouseup)="onMouseUp()"
       (mousemove)="onMouseMove($event)">
    <div *ngFor="let proceso of procesos" class="proceso-card">
      <div class="proceso-img-wrap">
        <img [src]="getImagen(proceso)" [appAjusteImagen]="proceso" [alt]="proceso.titulo" class="proceso-img" loading="lazy">
      </div>
      <div class="proceso-info">
        <h3 class="proceso-title">{{ proceso.titulo }}</h3>
        <p class="proceso-desc">{{ proceso.descripcion }}</p>
      </div>
    </div>
  </div>
</section>
