<div class="actualizar-container">
  <div class="form-card">
    <h2>Actualizar Proyecto</h2>
    <p class="subtitle">Modifica los datos del proyecto seleccionado.</p>

    <!-- Estado de Carga Inicial -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando datos del proyecto...</p>
    </div>

    <!-- Formulario (visible cuando los datos están listos) -->
    <form *ngIf="!isLoading && proyecto" (ngSubmit)="actualizar()">
      <!-- Título -->
      <div class="form-group">
        <label for="titulo">Título del Proyecto</label>
        <input type="text" id="titulo" name="titulo" [(ngModel)]="proyecto.titulo" required [disabled]="isSaving" />
      </div>

      <!-- Subtítulo -->
      <div class="form-group">
        <label for="subtitulo">Subtítulo</label>
        <input type="text" id="subtitulo" name="subtitulo" [(ngModel)]="proyecto.subtitulo" [disabled]="isSaving" />
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" [(ngModel)]="proyecto.descripcion" rows="4" required [disabled]="isSaving"></textarea>
      </div>

      <!-- Año -->
      <div class="form-group">
        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" [(ngModel)]="proyecto.anio" required [disabled]="isSaving" />
      </div>

      <!-- Selección de Categorías -->
      <div class="form-group">
        <label>Categorías</label>
        <div class="category-checkbox-group">
          <div *ngFor="let cat of todasLasCategorias" class="checkbox-item">
            <input type="checkbox" [id]="'cat-' + cat.idCategoria" [name]="'cat-' + cat.idCategoria" [(ngModel)]="categoriasSeleccionadas[cat.idCategoria]" [disabled]="isSaving" />
            <label [for]="'cat-' + cat.idCategoria">{{ cat.nombre }}</label>
          </div>
        </div>
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMsg" class="error-alert">
        {{ errorMsg }}
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions">
        <button type="button" routerLink="/administracion/proyecto/listar" class="btn-cancel" [disabled]="isSaving">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Guardando...' : 'Actualizar Proyecto' }}
        </button>
      </div>
    </form>
  </div>
</div>
