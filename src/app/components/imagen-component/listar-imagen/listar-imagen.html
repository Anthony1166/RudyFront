<div class="listar-container">
  <div class="header-actions">
    <h2>Galería de Imágenes</h2>
    <a routerLink="/administracion/imagenes/registrar" class="btn-add">
      ➕ Subir Imagen
    </a>
  </div>

  <!-- Filtro por Proyecto -->
  <div class="filters-section">
    <div class="filter-group">
      <label for="filterProyecto">Filtrar por Proyecto:</label>
      <select id="filterProyecto" [(ngModel)]="selectedProyectoId" (change)="aplicarFiltro()">
        <option value="">Todos los Proyectos</option>
        <option *ngFor="let proj of proyectos" [value]="proj.idProyecto">{{ proj.titulo }}</option>
      </select>
    </div>
  </div>

  <!-- Estado de Carga -->
  <div *ngIf="isLoading" class="loading">
    Cargando imágenes...
  </div>

  <!-- Mensaje de Error -->
  <div *ngIf="errorMsg" class="error">
    {{ errorMsg }}
  </div>

  <!-- Galería de Imágenes -->
  <div *ngIf="!isLoading && !errorMsg" class="gallery">
    <div *ngFor="let img of imagenes" class="image-card">
      <img [src]="img.imagen" alt="{{ img.descripcion }}" class="gallery-image" />
      <div class="card-body">
        <p class="card-description">{{ img.descripcion || 'Sin descripción' }}</p>
      </div>
      <div class="card-footer">
        <button (click)="eliminar(img.id)" class="btn-action btn-delete" title="Eliminar">
          🗑️ Eliminar
        </button>
      </div>
    </div>

    <!-- Mensaje si no hay imágenes -->
    <div *ngIf="imagenes.length === 0" class="no-images-message">
      <p>No hay imágenes para mostrar que coincidan con el filtro seleccionado.</p>
    </div>
  </div>
</div>
