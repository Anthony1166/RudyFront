<div class="registrar-container">
  <div class="form-card">
    <h2>Subir Nueva Imagen</h2>
    <p class="subtitle">Selecciona un archivo, asígnale un proyecto y una descripción.</p>

    <form (ngSubmit)="subir()">
      <!-- Selector de Proyecto -->
      <div class="form-group">
        <label for="proyecto">Asignar a Proyecto</label>
        <select id="proyecto" name="proyecto" [(ngModel)]="idProyectoSeleccionado" required [disabled]="isLoading">
          <option [ngValue]="null" disabled>Selecciona un proyecto...</option>
          <option *ngFor="let proj of proyectos" [value]="proj.idProyecto">{{ proj.titulo }}</option>
        </select>
      </div>

      <!-- Selector de Archivo -->
      <div class="form-group">
        <label for="file">Archivo de Imagen</label>
        <input type="file" id="file" (change)="onFileSelected($event)" accept="image/*" required [disabled]="isLoading" />
      </div>

      <!-- Previsualización de Imagen -->
      <div *ngIf="previewUrl" class="preview-container">
        <img [src]="previewUrl" alt="Previsualización de la imagen" class="image-preview" />
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label for="descripcion">Descripción (opcional)</label>
        <textarea id="descripcion" name="descripcion" [(ngModel)]="descripcion" rows="3" [disabled]="isLoading"></textarea>
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMsg" class="error-alert">
        {{ errorMsg }}
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions">
        <button type="button" routerLink="/administracion/imagenes/listar" class="btn-cancel" [disabled]="isLoading">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="isLoading || !selectedFile || !idProyectoSeleccionado">
          {{ isLoading ? 'Subiendo...' : 'Subir Imagen' }}
        </button>
      </div>
    </form>
  </div>
</div>
