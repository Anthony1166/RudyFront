<div class="actualizar-container">
  <div class="form-card">
    <h2>Actualizar Categoría</h2>
    <p class="subtitle">Modifica los datos de la categoría seleccionada.</p>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando datos...</p>
    </div>

    <!-- Formulario (Solo visible cuando termina de cargar) -->
    <form *ngIf="!isLoading" (ngSubmit)="actualizar()">
      <div class="form-group">
        <label for="id">ID</label>
        <input
          type="text"
          id="id"
          name="id"
          [value]="categoria.idCategoria"
          disabled
          class="input-disabled"
        />
      </div>

      <div class="form-group">
        <label for="nombre">Nombre de la Categoría</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="categoria.nombre"
          placeholder="Ej: Desarrollo Web"
          required
          [disabled]="isSaving"
        />
      </div>

      <div *ngIf="errorMsg" class="error-alert">
        {{ errorMsg }}
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/administracion/categoria/listar" class="btn-cancel" [disabled]="isSaving">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Guardando...' : 'Actualizar Categoría' }}
        </button>
      </div>
    </form>
  </div>
</div>
